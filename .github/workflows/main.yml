name: Ruby
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - 'head'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
      - name: Run formatter property tests
        run: bundle exec rake property
      - name: Validate RBS signatures
        if: matrix.ruby == '3.3'
        run: bundle exec rbs validate
      - name: Run Steep
        if: matrix.ruby == '3.3'
        run: bundle exec steep check --no-daemon --severity-level error
  commonmark:
    runs-on: ubuntu-latest
    name: CommonMark compatibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Fetch official fixtures
        run: ruby script/fetch_commonmark_spec.rb spec/fixtures/commonmark.json
      - name: Run all fixtures
        run: ruby script/commonmark_compatibility.rb spec/fixtures/commonmark.json
