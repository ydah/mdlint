name: Ruby
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - 'head'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
      - name: Run formatter property tests
        run: bundle exec rake property
      - name: Validate RBS signatures
        if: matrix.ruby == '3.3'
        run: gem install rbs -v 4.1.2 --no-document && rbs validate
      - name: Run Steep
        if: matrix.ruby == '3.3'
        run: gem install steep -v 2.0.0 --no-document && steep check --no-daemon --severity-level error
  commonmark:
    runs-on: ubuntu-latest
    name: CommonMark compatibility
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Fetch official fixtures
        run: ruby script/fetch_commonmark_spec.rb spec/fixtures/commonmark.json
      - name: Run all fixtures
        run: ruby script/commonmark_compatibility.rb spec/fixtures/commonmark.json
